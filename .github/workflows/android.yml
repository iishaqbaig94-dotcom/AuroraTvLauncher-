name: Aurora TV Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aurora-tv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Aurora TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project
        run: |
          echo "Checking Aurora TV project..."
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraTVLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
